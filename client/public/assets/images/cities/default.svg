<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#2a2a3a"/>
  <!-- Skyline silhouette -->
  <rect x="20" y="100" width="30" height="80" fill="#444"/>
  <rect x="60" y="80" width="40" height="100" fill="#444"/>
  <rect x="110" y="60" width="35" height="120" fill="#444"/>
  <rect x="155" y="90" width="45" height="90" fill="#444"/>
  <rect x="210" y="70" width="30" height="110" fill="#444"/>
  <rect x="250" y="110" width="30" height="70" fill="#444"/>
  <!-- Ground -->
  <rect x="0" y="180" width="300" height="20" fill="#333"/>
  <!-- Windows (lit up) -->
  <rect x="65" y="90" width="8" height="8" fill="#ffd700" opacity="0.7"/>
  <rect x="80" y="100" width="8" height="8" fill="#ffd700" opacity="0.5"/>
  <rect x="120" y="75" width="8" height="8" fill="#ffd700" opacity="0.6"/>
  <rect x="165" y="105" width="8" height="8" fill="#ffd700" opacity="0.7"/>
  <rect x="180" y="120" width="8" height="8" fill="#ffd700" opacity="0.5"/>
  <rect x="220" y="85" width="8" height="8" fill="#ffd700" opacity="0.6"/>
</svg>

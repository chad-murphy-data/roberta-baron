<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#3a3a4a"/>
  <!-- Skyline silhouette -->
  <rect x="20" y="100" width="30" height="80" fill="#555"/>
  <rect x="60" y="80" width="40" height="100" fill="#555"/>
  <rect x="110" y="60" width="35" height="120" fill="#555"/>
  <rect x="155" y="90" width="45" height="90" fill="#555"/>
  <rect x="210" y="70" width="30" height="110" fill="#555"/>
  <rect x="250" y="110" width="30" height="70" fill="#555"/>
  <!-- Ground -->
  <rect x="0" y="180" width="300" height="20" fill="#444"/>
  <!-- Text -->
  <text x="150" y="50" font-family="Arial, sans-serif" font-size="18" fill="#666" text-anchor="middle">CITY</text>
</svg>
